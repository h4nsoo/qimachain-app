services:
  # FastAPI Backend Service
  backend:
    build:
      context: ./qimachain-backend
      dockerfile: Dockerfile
    container_name: qimachain-backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount trained models and data
      - ./qimachain-backend/trained_models:/app/trained_models:ro
      - ./qimachain-backend/data:/app/data:ro
    restart: unless-stopped
    networks:
      - qimachain-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Next.js Frontend Service
  frontend:
    build:
      context: ./qimachain-frontend
      dockerfile: Dockerfile
    container_name: qimachain-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - qimachain-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  qimachain-network:
    driver: bridge
    name: qimachain-network

volumes:
  backend-data:
    driver: local
